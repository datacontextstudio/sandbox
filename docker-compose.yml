# DataContext Studio — local MacBook dev stack
# See architecture-local.txt for topology overview.
#
# Apple Silicon note: the ollama container runs inside Docker Desktop's Linux
# VM and cannot access the Metal GPU. For GPU-accelerated inference, run Ollama
# natively on the host instead:
#   brew install ollama && ollama serve
# Then set OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env and remove
# (or comment out) the ollama service below.

services:

  # ---------------------------------------------------------------------------
  # Public Layer — reverse proxy
  # Optional: you can also hit the api directly on http://localhost:8000
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Layer — FastAPI application
  # Build context: ./services/api  (Dockerfile stub; replace with real app)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_PATH: /data/documents
    volumes:
      - storage_data:/data/documents
    depends_on:
      - ollama
      - qdrant
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LLM + Embedding Layer — Ollama
  # Pull models after first start: docker-compose exec ollama ollama pull llama3
  # Embedding model:               docker-compose exec ollama ollama pull nomic-embed-text
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vector DB Layer — Qdrant
  # Dashboard: http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Ingestion Layer — Redis queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Ingestion Layer — worker
  # Build context: ./services/worker  (Dockerfile stub; replace with real app)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./services/worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      STORAGE_PATH: /data/documents
    volumes:
      - storage_data:/data/documents
    depends_on:
      - redis
      - ollama
      - qdrant
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  ollama_data:    # Ollama model cache (~GB per model)
  qdrant_data:    # Vector DB collections + indexes
  redis_data:     # Redis AOF persistence
  storage_data:   # Raw documents before ingestion
